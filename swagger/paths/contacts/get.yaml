tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: 'Get list of contacts with this endpoint'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
      description: Page number for pagination. Default is 1.
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
      description: Number of items per page. Default is 10.
  - in: query
    name: sortBy
    schema:
      type: string
      enum:
        ['_id', 'name', 'isFavourite', 'createdAt', 'updatedAt', 'contactType']
      example: 'createdAt'
      description: Field to sort by. Default is _id.
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
      description: Sorting order. Allowed values - asc, desc. Default is asc.
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true
      description: Filter by "favourite" flag. Allowed values - true/false.
  - in: query
    name: type
    schema:
      type: string
      enum: ['work', 'home', 'personal']
      example: 'work'
      description: Contact type. Allowed values - work, home, personal.
responses:
  '200':
    description: 'Get all contacts'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              $ref: ../../components/schemas/contacts.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
